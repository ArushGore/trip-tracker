services:
  postgres:
    image: postgres:17-alpine
    container_name: trip-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-triptracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triptracker_dev}
      POSTGRES_DB: ${POSTGRES_DB:-triptracker}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-triptracker} -d ${POSTGRES_DB:-triptracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
